name: Secret scan

# Gitleaks secret detection on every push and pull request. Catches accidentally
# committed secrets (API tokens, private keys) before they reach the public repo.
# Runs the OSS `gitleaks` binary directly, without the gitleaks-action.
# Version-pinned and SHA256-verified in the runner.

"on":
  push:
  pull_request:

# Least privilege: this job only reads the repo.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan reaches every commit, not just the working tree.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          printf '%s  /tmp/gitleaks.tgz\n' "$GITLEAKS_SHA256" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Detect secrets
        run: |
          gitleaks git \
            --redact \
            --log-opts="--all --full-history" \
            --report-path /tmp/gitleaks-report.json \
            --report-format json \
            --verbose .
